name: IBM assurance presentation verification
on:
  pull_request:
    paths:
      - 'ibm-assurance-presentation.mjs'
      - 'ibm-assurance-presentation.test.mjs'
      - 'modernization-decision-package-model.mjs'
      - 'modernization-economics-ui.mjs'
      - '.github/workflows/ibm-assurance-presentation.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ibm-assurance-presentation.test.mjs modernization-decision-package-model.test.mjs cif-economic-p1-workflow.test.mjs
